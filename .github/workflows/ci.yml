name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e (Playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-shell
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Builds the app and serves it on port 3110 via the webServer block in playwright.config.ts.
      - run: pnpm e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    name: lighthouse (budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Pinned, run with npx so Lighthouse stays out of the app's lockfile.
      # One automatic retry: a busy runner occasionally slows a whole attempt
      # (perf 0.83-0.88 with every other run at 0.99). Budgets are unchanged; a
      # real regression fails both attempts. Both results are logged.
      - name: Lighthouse, attempt 1
        id: lh1
        continue-on-error: true
        run: npx -y @lhci/cli@0.16.1 autorun
      - name: Keep attempt 1 reports
        if: ${{ !cancelled() }}
        run: mkdir -p lighthouse-attempts && mv .lighthouseci lighthouse-attempts/attempt-1 2>/dev/null || true
      - name: Lighthouse, attempt 2 (only if attempt 1 failed)
        id: lh2
        if: ${{ steps.lh1.outcome == 'failure' }}
        run: npx -y @lhci/cli@0.16.1 autorun
      - name: Keep attempt 2 reports
        if: ${{ !cancelled() && steps.lh1.outcome == 'failure' }}
        run: mv .lighthouseci lighthouse-attempts/attempt-2 2>/dev/null || true
      - name: Log both attempts
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Lighthouse budgets"
            echo "- attempt 1: ${{ steps.lh1.outcome }}"
            echo "- attempt 2: ${{ steps.lh2.outcome == 'skipped' && 'not needed' || steps.lh2.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "attempt 1: ${{ steps.lh1.outcome }} · attempt 2: ${{ steps.lh2.outcome == 'skipped' && 'not needed' || steps.lh2.outcome }}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-attempts/*/reports
          retention-days: 7
          if-no-files-found: ignore
